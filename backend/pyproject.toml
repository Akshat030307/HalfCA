[project]
name = "halfca"
version = "0.1.0"
description = "Half CA: AI GST reconciliation that follows the goods"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "duckdb>=1.1",
    "rapidfuzz>=3.9",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "weasyprint>=62",
    "mcp>=1.2",
    "httpx>=0.27",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halfca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
