<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half CA — follows the goods</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff0e1;color:#1c130c;font-family:var(--fb);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#1c130c}a:hover{color:#7b6352}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid #1c130c;outline-offset:3px}
.navlink{color:#1c130c;text-decoration:none;font-size:15px;font-weight:500;padding:12px 4px}
.navlink:hover{color:#7b6352}
.chip{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 14px;border:1px dashed #c9a98e;background:transparent;color:#1c130c;text-align:left;border-radius:6px;transition:transform .18s ease,background .18s ease,border-color .18s ease}
.chip:hover{background:#fff8f0;border-color:#1c130c}
.chip.on{border-style:solid;border-color:#1c130c;background:#fff8f0;animation:drop .32s cubic-bezier(.2,.9,.3,1.2)}
.chip .box{width:34px;height:34px;flex:none;border:1.5px solid #1c130c;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:13px;font-weight:700;background:#fff8f0}
.chip.on .box{background:#1c130c;color:#fff0e1}
@keyframes drop{0%{transform:translateY(-10px) rotate(-1deg);opacity:.4}100%{transform:none;opacity:1}}
.step{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #ebcfb8;font-size:15px}
.step .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #c9a98e;flex:none}
.step .st{margin-left:auto;font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:#7b6352}
.step.done .dot{background:#1c130c;border-color:#1c130c}
.step.active .dot{background:var(--acc);border-color:#1c130c;animation:pulse .8s ease-in-out infinite}
.step.active .st{color:#1c130c;font-weight:700}
.step.skipped{color:#7b6352;text-decoration:line-through;text-decoration-color:#c9a98e}
.step.todo{color:#7b6352}
@keyframes pulse{50%{transform:scale(1.5)}}
.log{font-family:var(--fm);font-size:12.5px;line-height:1.7;color:#fff0e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log.skip{color:#d9b89c}
.cursor{display:inline-block;width:8px;height:15px;background:#fff0e1;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flag{display:flex;gap:14px;align-items:flex-start;width:100%;padding:14px 0;border:0;border-bottom:1px solid #ebcfb8;background:transparent;color:#1c130c;text-align:left;animation:drop .3s ease both}
.flag:hover .flagt{text-decoration:underline}
.tag{font-family:var(--fm);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border:1px solid #1c130c;border-radius:3px;white-space:nowrap}
.tab{min-height:44px;padding:10px 16px;border:1.5px solid #1c130c;background:transparent;color:#1c130c;border-radius:999px;font-size:14px;font-weight:600}
.tab:hover{background:#ffdcc2}
.tab.on{background:#1c130c;color:#fff0e1}
.route{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.node{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--fm);font-weight:700;font-size:16px;transition:all .3s ease}
.node.ok{background:#1c130c;color:#fff0e1;border:2px solid #1c130c}
.node.miss{background:var(--acc);color:#1c130c;border:2px dashed #1c130c}
.seg{flex:1;height:0;border-top:3px solid #1c130c;transition:all .3s ease}
.seg.broken{border-top:3px dashed #c9a98e}
.seg.none{border-color:transparent}
.sdet.miss{color:#1c130c;font-weight:600}
.seg-btn{min-height:36px;padding:6px 12px;border:1px solid #c9a98e;background:transparent;color:#1c130c;font-size:13px;font-weight:600;border-radius:4px}
.seg-btn:hover{border-color:#1c130c}
.seg-btn.on.accept{background:#1c130c;color:#fff0e1;border-color:#1c130c}
.seg-btn.on.reject{background:#fff8f0;border:1.5px solid #1c130c;text-decoration:line-through}
.seg-btn.on.pending{background:var(--acc);border-color:#1c130c}
.imsrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr) minmax(0,1.6fr) auto;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid #ebcfb8}
.mod{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1.4fr);gap:24px;align-items:baseline;padding:22px 8px;border-bottom:1px solid #1c130c;transition:background .15s ease,padding .2s ease}
.mod:hover{background:#ffdcc2;padding-left:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:6px;font-size:15px;font-weight:600;text-decoration:none;border:1.5px solid #1c130c}
.btn.dark{background:#1c130c;color:#fff0e1}
.btn.dark:hover{background:#3a2a1d;color:#fff0e1}
.btn.acc{background:var(--acc);color:#1c130c}
.btn.acc:hover{filter:brightness(1.06);color:#1c130c}
.btn.ghost{background:transparent;color:#1c130c}
.btn.ghost:hover{background:#ffdcc2}
.btn:disabled{opacity:.45}
.seg.live{border-top:0;height:3px;background:repeating-linear-gradient(90deg,#1c130c 0 14px,var(--acc) 14px 22px);background-size:44px 3px;animation:march 1.1s linear infinite}
@keyframes march{to{background-position:44px 0}}
.ticker{display:flex;width:max-content;animation:tick 48s linear infinite}
.tickwrap:hover .ticker{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.herobox{min-height:min(860px,100vh)}
.hint-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);border:1.5px solid #1c130c;animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ticker,.seg.live,.hint-dot{animation:none}}
@media (max-width:900px){
.herobox{min-height:980px}
.route{grid-template-columns:1fr;gap:18px}
.route .seg{display:none}
.imsrow{grid-template-columns:1fr 1fr}
.mod{grid-template-columns:48px 1fr}
.mod .mdesc{grid-column:2}
.hidem{display:none !important}
}
</style>

<style>
#fontpick{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:8px;background:#1c130c;color:#fff0e1;padding:8px 10px;border-radius:8px;font:12px/1 'JetBrains Mono',monospace;box-shadow:0 6px 24px rgba(28,19,12,.25)}
#fontpick select{font:inherit;background:#fff0e1;color:#1c130c;border:0;border-radius:4px;padding:6px 8px}
#fontpick input{width:28px;height:24px;border:0;padding:0;background:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="fontpick"><label for="fp">Fonts</label><select id="fp"></select><label for="ac">Accent</label><input id="ac" type="color"></div>
